<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AST Visualization</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #1e1e2e;
            color: #cdd6f4;
            font-family: sans-serif;
            overflow: hidden;
        }
        #header {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 20px;
            font-weight: bold;
            pointer-events: none;
        }
        .node circle {
            fill: #89b4fa;
            stroke: #b4befe;
            stroke-width: 2px;
            cursor: pointer;
        }
        .node text {
            font-size: 13px;
            fill: #cdd6f4;
        }
        .link {
            fill: none;
            stroke: #585b70;
            stroke-width: 2px;
        }
    </style>
</head>
<body>
    <div id="header">Abstract Syntax Tree (AST) - D3.js</div>
    <svg id="tree-svg" width="100vw" height="100vh"></svg>

    <script>
        d3.json("ast.json").then(data => {
            const width = window.innerWidth;
            const height = window.innerHeight;

            const svg = d3.select("#tree-svg")
                .call(d3.zoom().on("zoom", (event) => {
                    g.attr("transform", event.transform);
                }));

            const g = svg.append("g")
                .attr("transform", "translate(100, " + (height / 2) + ")");

            const root = d3.hierarchy(data);
            const treeLayout = d3.tree().nodeSize([45, 180]);
            treeLayout(root);

            g.selectAll(".link")
                .data(root.links())
                .enter()
                .append("path")
                .attr("class", "link")
                .attr("d", d3.linkHorizontal()
                    .x(d => d.y)
                    .y(d => d.x)
                );

            const node = g.selectAll(".node")
                .data(root.descendants())
                .enter()
                .append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${d.y},${d.x})`);

            node.append("circle")
                .attr("r", 6);

            node.append("text")
                .attr("dy", ".35em")
                .attr("x", d => d.children ? -12 : 12)
                .style("text-anchor", d => d.children ? "end" : "start")
                .text(d => d.data.name);
        }).catch(err => {
            console.error("Error loading ast.json:", err);
            alert("Could not load ast.json. Make sure the local web server is running.");
        });
    </script>
</body>
</html>
